<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme="dark"">
<title>CSNEWS Console — Backend Health Dashboard</title>
<style>
/* ============================================================
 * CSNEWS Console — Neo Kinpaku 设计系统
 * 跟 news-reader 共用同一份 Kinpaku tokens 块,各自特化布局
 * 本地工具 · 零外部依赖 · Token 仅存 localStorage
 * ============================================================ */

:root {
  color-scheme: dark;
  /* —— Neo Kinpaku tokens (warm lacquer 黑) —— */
  --bg: #14110f;
  --bg-1: #1c1814;
  --bg-2: #251f1a;
  --bg-hover: #2e2722;
  --bg-overlay: rgba(20, 17, 15, 0.72);
  --hairline: rgba(240, 230, 215, 0.16);
  --hairline-strong: rgba(240, 230, 215, 0.28);
  --text: #f0e6d7;
  --text-2: #c8b8a0;
  --text-3: #8a7a64;
  --gold: #d4a253;
  --gold-2: #e3bf75;
  --gold-bg: rgba(212, 162, 83, 0.10);
  --gold-bg-strong: rgba(212, 162, 83, 0.16);
  --patina: #7ab3a8;
  --patina-2: #98c5bb;
  --patina-bg: rgba(122, 179, 168, 0.10);
  --success: #4ade80;
  --success-bg: rgba(74, 222, 128, 0.10);
  --danger: #f87171;
  --danger-bg: rgba(248, 113, 113, 0.10);
  --warning: #fbbf24;
  --warning-bg: rgba(251, 191, 36, 0.10);
  --info: #60a5fa;
  --info-bg: rgba(96, 165, 250, 0.10);
  --radius: 2px;
  --radius-sm: 2px;
  --radius-lg: 4px;
  --shadow: none;
  --shadow-hover: 0 1px 0 var(--hairline-strong);
  --font-mono: 'SF Mono', ui-monospace, 'Menlo', 'Monaco', 'Cascadia Code', monospace;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 280ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* OKLCH 真值覆盖 */
@supports (color: oklch(0% 0 0)) {
  :root {
    --bg: oklch(7% 0.006 95);
    --bg-1: oklch(9% 0.006 95);
    --bg-2: oklch(12% 0.006 95);
    --bg-hover: oklch(14% 0.006 95);
    --bg-overlay: oklch(7% 0.006 95 / 72%);
    --hairline: oklch(78% 0 0 / 0.16);
    --hairline-strong: oklch(78% 0 0 / 0.28);
    --text: oklch(92% 0.005 95);
    --text-2: oklch(72% 0.008 95);
    --text-3: oklch(52% 0.008 95);
    --gold: oklch(84% 0.19 80.46);
    --gold-2: oklch(88% 0.16 80.46);
    --gold-bg: oklch(84% 0.19 80.46 / 10%);
    --gold-bg-strong: oklch(84% 0.19 80.46 / 16%);
    --patina: oklch(70% 0.105 190);
    --patina-2: oklch(76% 0.085 190);
    --patina-bg: oklch(70% 0.105 190 / 10%);
    --success: oklch(72% 0.16 150);
    --success-bg: oklch(72% 0.16 150 / 10%);
    --danger: oklch(62% 0.21 25);
    --danger-bg: oklch(62% 0.21 25 / 10%);
    --warning: oklch(78% 0.17 80);
    --warning-bg: oklch(78% 0.17 80 / 10%);
    --info: oklch(65% 0.15 240);
    --info-bg: oklch(65% 0.15 240 / 10%);
  }
}

/* ============================================================
 * Reset & base
 * ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  font-feature-settings: 'cv11', 'ss01', 'ss03';
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--hairline-strong); }
::-webkit-scrollbar-corner { background: transparent; }

/* ============================================================
 * App layout — top tab bar + main
 * ============================================================ */
.app {
  display: grid;
  grid-template-rows: 52px 1fr;
  height: 100vh;
}

/* —— Top header (tab bar) —— */
.header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid var(--hairline);
  background: var(--bg);
  gap: 16px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: -0.01em;
}
.logo-mark {
  width: 22px;
  height: 22px;
  background: var(--gold);
  color: oklch(15% 0 0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  font-family: var(--font-mono);
  border-radius: var(--radius);
}
.logo-text { color: var(--text); }
.logo-sep { color: var(--text-3); margin: 0 1px; }
.logo-sub {
  color: var(--text-3);
  font-weight: 400;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  margin: 0 auto;
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  background: transparent;
  border: 1px solid transparent;
  border-bottom: none;
  color: var(--text-3);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
  font-family: var(--font-sans);
  position: relative;
  border-radius: var(--radius) var(--radius) 0 0;
}
.tab:hover {
  color: var(--text-2);
  background: var(--bg-1);
}
.tab.active {
  color: var(--gold);
  background: var(--bg-1);
  border-color: var(--hairline);
  border-bottom: 1px solid var(--bg-1);
  margin-bottom: -1px;
}
.tab .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.tab .count {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-3);
  padding: 1px 5px;
  background: var(--bg-2);
  border-radius: 3px;
}
.tab.active .count { color: var(--gold); background: var(--gold-bg); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 10px 4px 9px;
  background: var(--bg-1);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  font-size: 11.5px;
  color: var(--text-2);
  font-family: var(--font-mono);
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.status.online .status-dot { background: var(--success); }
.status.offline .status-dot { background: var(--danger); }
.status.warning .status-dot { background: var(--warning); }
.status.config .status-dot { background: var(--gold); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 5px 11px;
  background: transparent;
  color: var(--text-2);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  font-size: 12px;
  font-family: var(--font-sans);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  height: 28px;
  white-space: nowrap;
  text-decoration: none;
}
.btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--hairline-strong); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--gold); color: oklch(15% 0 0); border-color: var(--gold); font-weight: 600; }
.btn.primary:hover { background: var(--gold-2); border-color: var(--gold-2); }
.btn.ghost { border-color: transparent; }
.btn.ghost:hover { background: var(--bg-hover); border-color: var(--hairline); }
.btn-icon { padding: 0; width: 28px; }
.btn svg { width: 13px; height: 13px; }
.btn.small { height: 24px; font-size: 11px; padding: 3px 8px; }

.kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  background: var(--bg-2);
  border: 1px solid var(--hairline-strong);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-2);
}

/* —— Main —— */
.main {
  background: var(--bg-1);
  overflow-y: auto;
  border-top: 1px solid var(--hairline);
}

/* ============================================================
 * Overview tab — Dashboard (Linear/Vercel 风格)
 * ============================================================ */
.dashboard {
  padding: 20px 28px 60px;
  max-width: 1280px;
  margin: 0 auto;
}

/* KPI row */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.kpi {
  background: var(--bg);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 16px 18px;
  position: relative;
  transition: border-color var(--transition);
}
.kpi:hover { border-color: var(--hairline-strong); }
.kpi-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  margin-bottom: 10px;
}
.kpi-label .icon {
  width: 12px;
  height: 12px;
  color: var(--gold);
}
.kpi-value {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 600;
  color: var(--text);
  line-height: 1;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}
.kpi-value.danger { color: var(--danger); }
.kpi-value.warning { color: var(--warning); }
.kpi-value.success { color: var(--success); }
.kpi-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-3);
  font-family: var(--font-mono);
}
.kpi-meta .trend-up { color: var(--success); }
.kpi-meta .trend-down { color: var(--danger); }
.kpi-status {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-3);
}
.kpi-status.ok { background: var(--success); }
.kpi-status.warn { background: var(--warning); }
.kpi-status.fail { background: var(--danger); }

.kpi-spark {
  margin-top: 6px;
  height: 24px;
  width: 100%;
}

/* Row of two: chart + activity */
.row-2 {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.panel {
  background: var(--bg);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  overflow: hidden;
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--hairline);
}
.panel-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-title .icon { width: 13px; height: 13px; color: var(--gold); }
.panel-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-3);
}
.panel-body { padding: 16px 18px; }

/* Chart panels */
.chart-panel .panel-body {
  padding: 20px 18px 18px;
}
.chart-svg {
  width: 100%;
  height: 180px;
  display: block;
}
.chart-svg .axis { stroke: var(--hairline); stroke-width: 1; }
.chart-svg .axis-label { fill: var(--text-3); font-size: 10px; font-family: var(--font-mono); }
.chart-svg .grid-line { stroke: var(--hairline); stroke-width: 0.5; stroke-dasharray: 2 4; }
.chart-svg .line { fill: none; stroke: var(--gold); stroke-width: 1.5; }
.chart-svg .area { fill: var(--gold); opacity: 0.12; }
.chart-svg .point { fill: var(--gold); }
.chart-svg .bar { fill: var(--patina); }
.chart-svg .bar.alt { fill: var(--gold); }
.chart-svg .bar.warn { fill: var(--warning); }
.chart-svg .bar.danger { fill: var(--danger); }
.chart-svg .donut-segment { stroke: var(--bg); stroke-width: 2; }
.chart-svg .donut-label { fill: var(--text-2); font-size: 11px; font-family: var(--font-mono); }

.chart-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-3);
  font-size: 12px;
}

/* Activity panel */
.activity-list {
  list-style: none;
  max-height: 320px;
  overflow-y: auto;
}
.activity-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 12px;
}
.activity-item:last-child { border-bottom: none; }
.activity-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  margin-top: 7px;
  flex-shrink: 0;
}
.activity-dot.ok { background: var(--success); }
.activity-dot.warn { background: var(--warning); }
.activity-dot.fail { background: var(--danger); }
.activity-content { flex: 1; min-width: 0; }
.activity-title {
  color: var(--text);
  font-weight: 500;
  margin-bottom: 2px;
  word-break: break-word;
  line-height: 1.45;
}
.activity-meta {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-3);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.activity-meta .sep { color: var(--hairline-strong); }

/* Row of three: stat tables */
.row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}
.stat-table {
  width: 100%;
  border-collapse: collapse;
}
.stat-table th {
  text-align: left;
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  padding: 0 8px 8px;
  border-bottom: 1px solid var(--hairline);
}
.stat-table td {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text);
  padding: 8px;
  border-bottom: 1px solid var(--hairline);
  word-break: break-word;
}
.stat-table tr:last-child td { border-bottom: none; }
.stat-table .num { text-align: right; color: var(--gold); }
.stat-table .num.zero { color: var(--text-3); }

/* Status badges (for health checks) */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 7px;
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius);
  font-size: 10.5px;
  font-weight: 500;
  font-family: var(--font-mono);
  text-transform: lowercase;
}
.badge-ok { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.badge-down { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
.badge-warn { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
.badge-tier-normal { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.badge-tier-low { background: var(--patina-bg); border-color: var(--patina); color: var(--patina); }
.badge-tier-high { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
.badge-tier-degraded { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

/* ============================================================
 * Data tab — 22 endpoints grouped
 * ============================================================ */
.data-wrap {
  padding: 20px 28px 60px;
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 16px;
}
.endpoint-sidebar {
  background: var(--bg);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 14px 0;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  position: sticky;
  top: 20px;
}
.endpoint-group { margin-bottom: 14px; }
.endpoint-group:last-child { margin-bottom: 0; }
.endpoint-group-title {
  padding: 0 14px 6px;
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.endpoint-group-title .count {
  font-family: var(--font-mono);
  color: var(--text-3);
  font-weight: 400;
}
.endpoint-list { list-style: none; }
.endpoint-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  cursor: pointer;
  color: var(--text-2);
  font-size: 12.5px;
  border-left: 2px solid transparent;
  transition: all var(--transition);
  font-family: var(--font-mono);
}
.endpoint-item:hover { background: var(--bg-1); color: var(--text); }
.endpoint-item.active {
  background: var(--bg-1);
  color: var(--gold);
  border-left-color: var(--gold);
}
.endpoint-item .method {
  font-size: 9.5px;
  padding: 0 4px;
  background: var(--bg-2);
  color: var(--text-3);
  border-radius: 2px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.endpoint-item.post .method { background: var(--patina-bg); color: var(--patina); }

.endpoint-detail {
  background: var(--bg);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.endpoint-detail-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--hairline);
}
.endpoint-detail-title {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  font-family: var(--font-mono);
}
.endpoint-detail-desc {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.5;
}
.endpoint-params {
  padding: 14px 20px;
  border-bottom: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.param {
  display: inline-flex;
  align-items: center;
  background: var(--bg-1);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  height: 28px;
}
.param:focus-within { border-color: var(--gold); }
.param-label {
  padding: 0 8px;
  font-size: 10.5px;
  color: var(--text-3);
  font-family: var(--font-mono);
  border-right: 1px solid var(--hairline);
  height: 100%;
  display: flex;
  align-items: center;
}
.param input, .param select {
  background: transparent;
  border: none;
  color: var(--text);
  padding: 0 10px;
  height: 100%;
  font-size: 11.5px;
  font-family: var(--font-mono);
  outline: none;
  min-width: 50px;
}
.param select {
  cursor: pointer;
  padding-right: 24px;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M0 4l3 3 3-3' fill='none' stroke='%23c8b8a0' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 8px center;
}
.param input::placeholder { color: var(--text-3); }

.endpoint-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.endpoint-response {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}
.endpoint-response-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  border-top: 1px solid var(--hairline);
  background: var(--bg-1);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
}
.endpoint-response-meta strong { color: var(--text); font-weight: 500; }

/* ============================================================
 * Logs tab
 * ============================================================ */
.logs-wrap {
  padding: 20px 28px 60px;
  max-width: 1280px;
  margin: 0 auto;
}
.logs-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  padding: 14px 18px;
  background: var(--bg);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
}
.logs-controls .field { display: flex; align-items: center; gap: 8px; }
.logs-controls .field-label {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
}
.logs-controls input, .logs-controls select {
  background: var(--bg-1);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  color: var(--text);
  padding: 5px 10px;
  font-size: 12px;
  font-family: var(--font-mono);
  outline: none;
  height: 28px;
}
.logs-controls input:focus, .logs-controls select:focus { border-color: var(--gold); }

.logs-table {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  border-collapse: separate;
  border-spacing: 0;
  overflow: hidden;
}
.logs-table th, .logs-table td {
  padding: 8px 14px;
  text-align: left;
  border-bottom: 1px solid var(--hairline);

}
.logs-table th {
  background: var(--bg-1);
  color: var(--text-3);
  font-weight: 600;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.logs-table tr:last-child td { border-bottom: none; }
.logs-table .level {
  font-weight: 600;
  text-transform: uppercase;

.logs-table .level.info { color: var(--info); }
.logs-table .level.warn { color: var(--warning); }
.logs-table .level.error { color: var(--danger); }
.logs-table .level.debug { color: var(--text-3); }

/* ============================================================
 * Health tab — 9 dimensions + counts
 * ============================================================ */
.health-wrap {

.check-card {

}
.check-card:hover { border-color: var(--hairline-strong); }
.check-card.down { border-color: var(--danger); background: var(--danger-bg); }
.check-card.warn { border-color: var(--warning); }

.skeleton {

@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.error-banner-title {

/* ============================================================
 * Toast

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-1);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius);

  font-size: 12.5px;
  color: var(--text);

  opacity: 0;
  transition: all var(--transition-slow);

}

  transform: translateX(-50%) translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  .skeleton { animation: none; }
}

<script>
/* ===========================================================
 * CSNEWS Console — Dashboard for backend health verification
 * 共用 Neo Kinpaku tokens 块(跟 news-reader 保持同步)
 * =========================================================== */

const STORAGE = {
  base: 'csnews_console',
  get(k, d) { try { const v = localStorage.getItem(this.base + ':' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(this.base + ':' + k, JSON.stringify(v)); } catch {} },
  remove(k) { localStorage.removeItem(this.base + ':' + k); }
};

const STATE = {
  tab: 'overview',
  config: STORAGE.get('config', { baseUrl: '', token: '' }),
  health: null,
  healthErr: null,
  news7d: [],
  news7dErr: null,
  entity: null,
  entityErr: null,
  event: null,
  eventErr: null,
  selectedEndpoint: 'pull-news',
  endpointResponse: null,
  endpointError: null,
  endpointLoading: false,
  logs: [],
  logsErr: null,
  logsDate: 'today',
  logsHour: '',
  logsLimit: 100,
  loading: false,
};

function getConfig() { return STATE.config; }
function isConfigured() { return STATE.config.baseUrl && STATE.config.token; }
function baseUrl() { return STATE.config.baseUrl.replace(/\/+$/, ''); }

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

function fmtNumber(n) {
  if (n == null) return '—';
  return n.toLocaleString('en-US');
}

// --- HTTP ---
async function apiGet(path, params) {
  const cfg = getConfig();
  let url = baseUrl() + path;
  if (params) url += '?' + new URLSearchParams(params).toString();
  const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + cfg.token } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// --- Data fetchers ---
async function fetchHealth() {
  return apiGet('/?action=health');
}
async function fetchNews7d() {
  const r = await apiGet('/', { action: 'pull', type: 'news', since: '7d', limit: '500', format: 'full' });
  return r.items || [];
}
async function fetchEntity() {
  return apiGet('/?action=entity&text=__latest__');
}
async function fetchEvent() {
  return apiGet('/?action=event&text=__latest__');
}
async function fetchLogs(date, hour, limit) {
  const params = { action: 'logs', limit: String(limit) };
  if (date) params.date = date;
  if (hour !== '' && hour != null) params.hour = String(hour);
  return apiGet('/', params);
}

// ============================================================
// Endpoints catalog (22 个)
// ============================================================
const ENDPOINTS = [
  // 日常检查
  { name: 'Pull News', action: 'pull', type: 'news', group: 'daily', method: 'GET',
    desc: '拉取新闻热点,默认按 created_at desc',
    params: [{ key: 'limit', label: 'limit', type: 'number', default: '20' },
             { key: 'since', label: 'since', type: 'text', placeholder: '24h / ISO 8601' },
             { key: 'level', label: 'level', type: 'select', options: ['', 'follow', 'important', 'explosive'] },
             { key: 'category', label: 'category', type: 'text' }] },
  { name: 'Pull Topics', action: 'pull', type: 'topics', group: 'daily', method: 'GET',
    desc: '拉取话题列表', params: [{ key: 'limit', label: 'limit', type: 'number', default: '20' }, { key: 'level', label: 'level', type: 'select', options: ['', 'follow', 'important', 'explosive'] }] },
  { name: 'Pull Warnings', action: 'pull', type: 'warnings', group: 'daily', method: 'GET',
    desc: '拉取警告', params: [{ key: 'limit', label: 'limit', type: 'number', default: '20' }] },
  { name: 'Pull Fission Pending', action: 'pull', type: 'fission-pending', group: 'daily', method: 'GET',
    desc: '拉取待裂变', params: [{ key: 'limit', label: 'limit', type: 'number', default: '20' }] },
  { name: 'Logs', action: 'logs', group: 'daily', method: 'GET',
    desc: '查 R2 持久化日志',
    params: [{ key: 'date', label: 'date', type: 'text', default: 'today' }, { key: 'hour', label: 'hour', type: 'number', min: 0, max: 23 }, { key: 'limit', label: 'limit', type: 'number', default: '100' }] },
  { name: 'Ping', action: 'ping', group: 'daily', method: 'GET', desc: '健康检查 (空 action fallback)', params: [] },
  { name: 'Health', action: 'health', group: 'daily', method: 'GET', desc: '9 维度健康检查 + AI 配额', params: [] },
  { name: 'Content', action: 'content', group: 'daily', method: 'GET', desc: '读单条新闻全文 (R2)', params: [{ key: 'id', label: 'id', type: 'text', required: true }] },
  { name: 'Trend', action: 'trend', group: 'daily', method: 'GET', desc: '话题趋势 (topics / velocity / acceleration)',
    params: [{ key: 'type', label: 'type', type: 'select', options: ['topics', 'velocity', 'acceleration'], default: 'topics' }, { key: 'limit', label: 'limit', type: 'number', default: '20' }] },
  { name: 'Entity', action: 'entity', group: 'daily', method: 'GET', desc: '自学习 entity candidates',
    params: [{ key: 'text', label: 'text', type: 'text' }] },
  { name: 'Event', action: 'event', group: 'daily', method: 'GET', desc: 'Adaptive Jaccard cluster',
    params: [{ key: 'text', label: 'text', type: 'text' }] },
  // 内部调试
  { name: 'Diag', action: 'diag', group: 'debug', method: 'GET', desc: '环境变量诊断', params: [] },
  { name: 'Model Test', action: 'model-test', group: 'debug', method: 'GET', desc: '测试 Workers AI 模型', params: [] },
  { name: 'AI Test', action: 'ai-test', group: 'debug', method: 'GET', desc: 'AI 模型 + 内容生成',
    params: [{ key: 'title', label: 'title', type: 'text', placeholder: 'AI 评分/分类测试标题' }] },
  { name: 'Score', action: 'score', group: 'debug', method: 'GET', desc: '单条标题打分',
    params: [{ key: 'title', label: 'title', type: 'text', required: true }] },
  { name: 'Classify', action: 'classify', group: 'debug', method: 'GET', desc: '单条标题分类',
    params: [{ key: 'title', label: 'title', type: 'text', required: true }] },
  { name: 'Batch Score', action: 'batch-score', group: 'debug', method: 'POST', desc: '批量打分 (POST)', params: [] },
  { name: 'Save', action: 'save', group: 'debug', method: 'POST', desc: '手动入库 (POST)', params: [] },
  { name: 'List', action: 'list', group: 'debug', method: 'GET', desc: 'R2 prefix 列表',
    params: [{ key: 'prefix', label: 'prefix', type: 'text' }, { key: 'limit', label: 'limit', type: 'number', default: '20' }] },
  { name: 'Embed', action: 'embed', group: 'debug', method: 'GET', desc: 'bge-m3 向量化',
    params: [{ key: 'text', label: 'text', type: 'text', required: true }] },
  { name: 'Zaker Hot', action: 'zaker-hot', group: 'debug', method: 'GET', desc: '拉 ZAKER 热点 (调试)', params: [] },
  { name: 'Process', action: 'process', group: 'debug', method: 'GET', desc: '手动触发 process (cron normally)',
    params: [] },
  { name: 'Knowledge', action: 'knowledge', group: 'debug', method: 'GET', desc: '知识累积 daily/topic',
    params: [{ key: 'type', label: 'type', type: 'select', options: ['daily', 'topic'], default: 'daily' }] },
];

const GROUPS = {
  daily: { name: '日常检查', desc: 'pull × 5 + logs + ping + health + content + trend + entity + event' },
  debug: { name: '内部调试', desc: 'diag / score / classify / batch-score / save / list / embed / zaker-hot / process / knowledge / model-test / ai-test' }
};

// ============================================================
// Status
// ============================================================
function updateStatus() {
  const status = document.getElementById('status');
  const text = document.getElementById('status-text');
  status.className = 'status';
  if (!isConfigured()) {
    status.classList.add('config');
    text.textContent = '未配置';
  } else if (STATE.loading) {
    text.textContent = '加载中…';
  } else if (STATE.healthErr) {
    status.classList.add('offline');
    text.textContent = '连接失败';
  } else if (STATE.health) {
    const s = STATE.health.status;
    if (s === 'ok' || s === 'healthy' || s === 'up') {
      status.classList.add('online');
      text.textContent = STATE.health.worker_version || 'OK';
    } else if (s === 'degraded') {
      status.classList.add('warning');
      text.textContent = 'degraded';
    } else {
      status.classList.add('offline');
      text.textContent = s || 'down';
    }
  }
}

let toastTimer = null;
function toast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2400);
}

// ============================================================
// JSON syntax highlighting (XSS-safe, regex)
// ============================================================
function highlightJson(json) {
  const escaped = escapeHtml(typeof json === 'string' ? json : JSON.stringify(json, null, 2));
  return escaped.replace(
    /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|([{}\[\],])/g,
    (m, str, colon, bool, num, punct) => {
      if (str) {
        return colon
          ? `<span class="json-key">${str}</span><span class="json-punct">${colon}</span>`
          : `<span class="json-string">${str}</span>`;
      }
      if (bool) {
        return bool === 'null'
          ? `<span class="json-null">${bool}</span>`
          : `<span class="json-bool">${bool}</span>`;
      }
      if (num) return `<span class="json-number">${num}</span>`;
      if (punct) return `<span class="json-punct">${punct}</span>`;
      return m;
    }
  );
}

// ============================================================
// SVG charts (纯手画,零依赖)
// ============================================================
function svgLineChart(data, opts = {}) {
  if (!data.length) return '<div class="chart-empty">暂无数据</div>';
  const w = 600, h = 180, padL = 40, padR = 12, padT = 12, padB = 28;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const max = Math.max(1, ...data.map(d => d.value));
  const step = innerW / Math.max(1, data.length - 1);
  const points = data.map((d, i) => {
    const x = padL + i * step;
    const y = padT + innerH - (d.value / max) * innerH;
    return { x, y, ...d };
  });
  // Path line
  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  // Area path (close to bottom)
  const areaD = pathD + ` L ${points[points.length - 1].x} ${padT + innerH} L ${points[0].x} ${padT + innerH} Z`;
  // Y axis grid lines
  const yLines = [0, 0.5, 1].map(t => {
    const y = padT + innerH - t * innerH;
    return `<line class="grid-line" x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}"/>`;
  }).join('');
  // Y axis labels
  const yLabels = [0, 0.5, 1].map(t => {
    const y = padT + innerH - t * innerH;
    const v = Math.round(t * max);
    return `<text class="axis-label" x="${padL - 6}" y="${y + 3}" text-anchor="end">${v}</text>`;
  }).join('');
  // X axis labels (every other day)
  const xLabels = data.map((d, i) => {
    if (i % Math.ceil(data.length / 7) !== 0 && i !== data.length - 1) return '';
    const x = padL + i * step;
    return `<text class="axis-label" x="${x}" y="${h - 8}" text-anchor="middle">${d.label || d.key}</text>`;
  }).join('');
  // Points
  const dots = points.map(p => `<circle class="point" cx="${p.x}" cy="${p.y}" r="2.5"/>`).join('');

  return `
    <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      <line class="axis" x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + innerH}"/>
      <line class="axis" x1="${padL}" y1="${padT + innerH}" x2="${w - padR}" y2="${padT + innerH}"/>
      ${yLines}${yLabels}${xLabels}
      <path class="area" d="${areaD}"/>
      <path class="line" d="${pathD}"/>
      ${dots}
    </svg>
  `;
}

function svgDonut(segments) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  if (!total) return '<div class="chart-empty">暂无数据</div>';
  const cx = 80, cy = 80, r = 60, ir = 38;
  const colors = ['var(--text-3)', 'var(--patina)', 'var(--gold)', 'var(--danger)'];
  let acc = 0;
  const arcs = segments.map((seg, i) => {
    const startAngle = (acc / total) * 2 * Math.PI - Math.PI / 2;
    acc += seg.value;
    const endAngle = (acc / total) * 2 * Math.PI - Math.PI / 2;
    const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const ix1 = cx + ir * Math.cos(endAngle);
    const iy1 = cy + ir * Math.sin(endAngle);
    const ix2 = cx + ir * Math.cos(startAngle);
    const iy2 = cy + ir * Math.sin(startAngle);
    if (seg.value === 0) return '';
    const path = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${ir} ${ir} 0 ${largeArc} 0 ${ix2} ${iy2} Z`;
    return `<path class="donut-segment" d="${path}" fill="${colors[i % colors.length]}"/>`;
  }).join('');
  const legend = segments.map((seg, i) => `
    <div style="display:flex; align-items:center; gap:6px; font-size:11px; padding:2px 0;">
      <span style="width:8px; height:8px; background:${colors[i % colors.length]}; border-radius:1px;"></span>
      <span style="color:var(--text-2);">${escapeHtml(seg.label)}</span>
      <span style="margin-left:auto; font-family:var(--font-mono); color:var(--text);">${seg.value}</span>
      <span style="color:var(--text-3); font-family:var(--font-mono);">${((seg.value / total) * 100).toFixed(0)}%</span>
    </div>
  `).join('');
  return `
    <div style="display: flex; align-items: center; gap: 18px;">
      <svg viewBox="0 0 160 160" width="160" height="160" style="flex-shrink:0;">${arcs}</svg>
      <div style="flex:1;">${legend}</div>
    </div>
  `;
}

function svgHistogram(bins) {
  if (!bins.length || bins.every(b => b === 0)) return '<div class="chart-empty">暂无数据</div>';
  const w = 600, h = 180, padL = 36, padR = 12, padT = 12, padB = 28;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const max = Math.max(1, ...bins);
  const barW = innerW / bins.length;
  const bars = bins.map((v, i) => {
    const bh = (v / max) * innerH;
    const x = padL + i * barW + 2;
    const y = padT + innerH - bh;
    const w2 = barW - 4;
    let cls = 'bar';
    if (i >= 7) cls = 'bar warn';
    if (i === bins.length - 1) cls = 'bar alt';
    return `<rect class="${cls}" x="${x}" y="${y}" width="${w2}" height="${bh}" rx="1"/>`;
  }).join('');
  // X labels (0, 5, 10)
  return `
    <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      <line class="axis" x1="${padL}" y1="${padT + innerH}" x2="${w - padR}" y2="${padT + innerH}"/>
      <text class="axis-label" x="${padL}" y="${h - 8}" text-anchor="start">0</text>
      <text class="axis-label" x="${padL + innerW / 2}" y="${h - 8}" text-anchor="middle">5</text>
      <text class="axis-label" x="${w - padR}" y="${h - 8}" text-anchor="end">10</text>
      ${bars}
    </svg>
  `;
}

          <div class="endpoint-detail-desc">${ep.desc}</div>
        </div>
        <div class="endpoint-params" id="endpoint-params">
          ${ep.params.length ? ep.params.map(p => `
            <span class="param">
              <span class="param-label">${p.label}${p.required ? ' *' : ''}</span>
              ${p.type === 'select' ? `
                <select data-param="${p.key}">
                  ${p.options.map(o => `<option value="${o}" ${o === p.default ? 'selected' : ''}>${o || '(empty)'}</option>`).join('')}
                </select>
              ` : p.type === 'number' ? `
                <input type="number" data-param="${p.key}" value="${p.default || ''}" min="${p.min || ''}" max="${p.max || ''}" placeholder="${p.placeholder || ''}" />
              ` : `
                <input type="text" data-param="${p.key}" value="${p.default || ''}" placeholder="${p.placeholder || ''}" />
              `}
            </span>
          `).join('') : '<span style="color: var(--text-3); font-size: 12px;">无参数</span>'}
          <div class="endpoint-actions">
            <button class="btn small" id="btn-copy-curl">复制 cURL</button>
            <button class="btn primary small" id="btn-run">${ep.method === 'POST' ? 'POST' : 'GET'} ↵</button>
          </div>
        </div>
        <div class="endpoint-response" id="endpoint-response">
          <div class="state" style="padding: 40px 20px;">
            <div class="state-title">点击 ↵ 按钮或按 ⌘ Enter 调用</div>
            <div class="state-desc">Token 自动附加为 <code>Authorization: Bearer</code></div>
          </div>
        </div>
        <div class="endpoint-response-meta" id="endpoint-response-meta"></div>
      </div>
    </div>
  `;

  // Bindings
  document.querySelectorAll('.endpoint-item').forEach(el => {
    el.addEventListener('click', () => {
      STATE.selectedEndpoint = el.dataset.endpoint;
      STATE.endpointResponse = null;
      STATE.endpointError = null;
      renderData();
    });
  });
  document.getElementById('btn-run').addEventListener('click', runEndpoint);
  document.getElementById('btn-copy-curl').addEventListener('click', copyCurl);
  // ⌘Enter to run
  document.getElementById('endpoint-params').addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      runEndpoint();
    }
  });

  // Render existing response if any
  if (STATE.endpointError) renderEndpointError(STATE.endpointError);
  else if (STATE.endpointResponse) renderEndpointSuccess(STATE.endpointResponse, STATE.endpointElapsed);
}

async function runEndpoint() {
  if (!isConfigured()) { openSettings(); return; }
  const ep = ENDPOINTS.find(e => e.action + (e.type ? '-' + e.type : '') === STATE.selectedEndpoint)
    || ENDPOINTS.find(e => e.action === STATE.selectedEndpoint);
  if (!ep) return;
  const params = {};
  document.querySelectorAll('#endpoint-params [data-param]').forEach(el => {
    const v = el.value.trim();
    if (v !== '') params[el.dataset.param] = v;
  });
  params.action = ep.action;
  if (ep.type) params.type = ep.type;

  STATE.endpointLoading = true;
  STATE.endpointError = null;
  STATE.endpointResponse = null;
  document.getElementById('endpoint-response').innerHTML = '<div class="state" style="padding: 40px 20px;"><div class="state-title">加载中…</div></div>';
  document.getElementById('endpoint-response-meta').innerHTML = '';

  try {
    const t0 = performance.now();
    const data = await apiGet('/', params);
    const elapsed = Math.round(performance.now() - t0);
    STATE.endpointResponse = data;
    STATE.endpointElapsed = elapsed;
    renderEndpointSuccess(data, elapsed);
  } catch (e) {
    STATE.endpointError = { message: e.message || String(e) };
    renderEndpointError(STATE.endpointError);
  } finally {
    STATE.endpointLoading = false;
  }
}

function renderEndpointSuccess(data, elapsed) {
  const json = JSON.stringify(data, null, 2);
  document.getElementById('endpoint-response').innerHTML =
    `<div class="json-view">${highlightJson(json)}</div>`;
  const ms = elapsed || 0;
  const msColor = ms < 200 ? 'var(--success)' : ms < 500 ? 'var(--warning)' : 'var(--danger)';
  document.getElementById('endpoint-response-meta').innerHTML = `
    <span>状态 <strong style="color: var(--success);">200 OK</strong></span>
    <span class="sep">·</span>
    <span>耗时 <strong style="color: ${msColor};">${ms}ms</strong></span>
    <span class="sep">·</span>
    <span>${json.length.toLocaleString()} bytes</span>
  `;
}

function renderEndpointError(err) {
  document.getElementById('endpoint-response').innerHTML = `
    <div class="error-banner" style="margin: 0;">
      <div class="error-banner-title">⚠ 调用失败</div>
      <div class="error-banner-body">${escapeHtml(err.message || String(err))}</div>
    </div>
  `;
  document.getElementById('endpoint-response-meta').innerHTML = `
    <span>状态 <strong style="color: var(--danger);">ERROR</strong></span>
  `;
}

function copyCurl() {
  const ep = ENDPOINTS.find(e => e.action + (e.type ? '-' + e.type : '') === STATE.selectedEndpoint)
    || ENDPOINTS.find(e => e.action === STATE.selectedEndpoint);
  const params = { action: ep.action };
  if (ep.type) params.type = ep.type;
  document.querySelectorAll('#endpoint-params [data-param]').forEach(el => {
    const v = el.value.trim();
    if (v !== '') params[el.dataset.param] = v;
  });
  const url = baseUrl() + '/?' + new URLSearchParams(params).toString();
  const cfg = getConfig();
  const masked = cfg.token.length > 6 ? cfg.token.slice(0, 4) + '…' + cfg.token.slice(-6) : '***';
  const curl = `curl -s "${url}" \\\n  -H "Authorization: Bearer ${masked}"`;
  navigator.clipboard.writeText(curl).then(() => toast('cURL 已复制', 'success'));
}

// ============================================================
// Logs tab
// ============================================================
async function renderLogs() {
  const c = document.getElementById('tab-content');
  c.innerHTML = `
    <div class="logs-wrap">
      <div class="logs-controls">
        <div class="field">
          <label class="field-label">Date</label>
          <input type="text" id="logs-date" value="${escapeHtml(STATE.logsDate)}" placeholder="today / YYYY-MM-DD" />
        </div>
        <div class="field">
          <label class="field-label">Hour</label>
          <input type="number" id="logs-hour" value="${escapeHtml(STATE.logsHour)}" placeholder="0-23" min="0" max="23" />
        </div>
        <div class="field">
          <label class="field-label">Limit</label>
          <input type="number" id="logs-limit" value="${STATE.logsLimit}" min="1" max="500" />
        </div>
        <button class="btn primary" id="logs-refresh">查询</button>
        <span style="color: var(--text-3); font-size: 11px; margin-left: auto;">共 ${STATE.logs.length} 条</span>
      </div>
      <div id="logs-table-wrap">
        ${STATE.logs.length ? renderLogsTable() : '<div class="state"><div class="state-title">暂无日志</div><div class="state-desc">调整 date / hour 试试</div></div>'}
      </div>
    </div>
  `;
  document.getElementById('logs-refresh').addEventListener('click', loadLogs);
  // Also on Enter in any input
  ['logs-date', 'logs-hour', 'logs-limit'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') loadLogs();
    });
  });
}

function renderLogsTable() {
  return `
    <table class="logs-table">
      <thead><tr><th>Level</th><th>Time</th><th>Event</th><th>Detail</th></tr></thead>
      <tbody>
        ${STATE.logs.slice(0, 200).map(l => `
          <tr>
            <td><span class="level ${l.level || 'info'}">${escapeHtml(l.level || 'info')}</span></td>
            <td>${escapeHtml(l.ts || l.created_at || '—')}</td>
            <td>${escapeHtml(l.event || l.message || '—')}</td>
            <td>${escapeHtml(typeof l.detail === 'object' ? JSON.stringify(l.detail) : (l.detail || ''))}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function loadLogs() {
  if (!isConfigured()) { openSettings(); return; }
  STATE.logsDate = document.getElementById('logs-date').value.trim() || 'today';
  STATE.logsHour = document.getElementById('logs-hour').value.trim();
  STATE.logsLimit = parseInt(document.getElementById('logs-limit').value, 10) || 100;
  try {
    const data = await fetchLogs(STATE.logsDate, STATE.logsHour, STATE.logsLimit);
    STATE.logs = Array.isArray(data) ? data : (data.items || data.logs || []);
    STATE.logsErr = null;
    renderLogs();
    toast(`已加载 ${STATE.logs.length} 条日志`, 'success');
  } catch (e) {
    STATE.logsErr = { message: e.message || String(e) };
    STATE.logs = [];
    renderLogs();
    toast(`查询失败: ${e.message}`, 'error');
  }
}

// ============================================================
// Health tab
// ============================================================

    return;
  }
  const h = STATE.health;
  const checks = h.checks || {};
  c.innerHTML = `
    <div class="health-wrap">
      <div class="health-section">
        <div class="health-section-title">9 维度健康检查</div>
        <div class="health-grid">
          ${Object.entries(checks).map(([name, c]) => `
            <div class="check-card ${c.status === 'ok' ? 'ok' : c.status === 'warn' ? 'warn' : 'down'}">
              <div class="check-card-header">
                <div class="check-card-name">${escapeHtml(name)}</div>

          <div class="panel-body">
            <table class="stat-table">
              <thead><tr><th>Table</th><th style="text-align:right">Rows</th></tr></thead>
              <tbody>${Object.entries(h.supabase_counts || {}).map(([k, v]) => `
                <tr><td>${escapeHtml(k)}</td><td class="num ${v === 0 ? 'zero' : ''}">${fmtNumber(v)}</td></tr>
              `).join('')}</tbody>
            </table>

        </div>
      </div>

      <div class="health-section">
        <div class="health-section-title">R2 Bucket</div>
        <div class="panel">
          <div class="panel-body">
            <table class="stat-table">
              <thead><tr><th>Prefix</th><th style="text-align:right">Objects</th></tr></thead>
              <tbody>${Object.entries(h.r2_prefix_counts || {}).map(([k, v]) => `
                <tr><td>${escapeHtml(k)}</td><td class="num ${v === 0 ? 'zero' : ''}">${fmtNumber(v)}</td></tr>
              `).join('')}</tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="health-section">
        <div class="health-section-title">AI Budget (今日)</div>
        <div class="panel">
          <div class="panel-body">
            <table class="stat-table">
              <tbody>
                <tr><td>tier</td><td style="text-align:right;"><span class="badge badge-tier-${h.ai_budget_today?.tier || 'normal'}">${(h.ai_budget_today?.tier || 'normal').toUpperCase()}</span></td></tr>
                <tr><td>used</td><td class="num">${fmtNumber(h.ai_budget_today?.used || 0)}</td></tr>
                <tr><td>quota</td><td class="num">${fmtNumber(h.ai_budget_today?.quota || 0)}</td></tr>
                <tr><td>remaining</td><td class="num">${fmtNumber(h.ai_budget_today?.remaining || 0)}</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ============================================================
// Tab routing
// ============================================================
function renderTab() {
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === STATE.tab);
  });
  if (STATE.tab === 'overview') renderOverview();
  else if (STATE.tab === 'data') renderData();
  else if (STATE.tab === 'logs') renderLogs();
  else if (STATE.tab === 'health') renderHealth();
}

// ============================================================
// Main refresh
// ============================================================
async function refresh() {
  if (!isConfigured()) { openSettings(); return; }
  STATE.loading = true;
  STATE.healthErr = null;
  STATE.news7dErr = null;
  STATE.entityErr = null;
  STATE.eventErr = null;
  if (STATE.tab === 'overview') renderOverview();
  updateStatus();

  try {
    STATE.health = await fetchHealth();
    document.getElementById('tab-count-overview').textContent = STATE.health.worker_version || '✓';
  } catch (e) {
    STATE.healthErr = { message: e.message || String(e) };
    document.getElementById('tab-count-overview').textContent = '!';
  }

  try {
    STATE.news7d = await fetchNews7d();
  } catch (e) {
    STATE.news7dErr = { message: e.message || String(e) };
    STATE.news7d = [];
  }

  try {
    STATE.entity = await fetchEntity();
  } catch (e) {
    STATE.entityErr = { message: e.message || String(e) };
    STATE.entity = null;
  }

  try {
    STATE.event = await fetchEvent();
  } catch (e) {
    STATE.eventErr = { message: e.message || String(e) };
    STATE.event = null;
  }

  STATE.loading = false;
  updateStatus();
  renderTab();
  toast('已刷新', 'success');
}

// ============================================================
// Settings modal
// ============================================================
function openSettings() {
  document.getElementById('cfg-url').value = STATE.config.baseUrl || '';
  document.getElementById('cfg-token').value = STATE.config.token || '';
  document.getElementById('settings-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('cfg-url').focus(), 50);
}
function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
function saveSettings() {
  const baseUrl = document.getElementById('cfg-url').value.trim().replace(/\/+$/, '');
  const token = document.getElementById('cfg-token').value.trim();
  if (!baseUrl || !token) { toast('URL 和 Token 必填', 'error'); return; }
  STATE.config = { baseUrl, token };
  STORAGE.set('config', STATE.config);
  closeSettings();
  toast('已保存', 'success');
  refresh();
}

// ============================================================
// Help modal (⌘K)
// ============================================================
const HELP_GROUPS = [
  { title: '导航', items: [
    { keys: ['1-4'], desc: 'Overview / Data / Logs / Health' },
    { keys: ['⌘', 'R'], desc: '刷新拉取最新' },
    { keys: ['⌘', 'K'], desc: '打开 / 关闭快捷键帮助' },
    { keys: ['⌘', '?'], desc: '同上 (Windows 友好)' },
    { keys: ['⌘', ','], desc: '打开设置' },
    { keys: ['Esc'], desc: '关闭弹窗' },
  ]},
  { title: 'Data Tab', items: [
    { keys: ['Click'], desc: '左侧选 endpoint,右侧填参数' },
    { keys: ['⌘', 'Enter'], desc: '在参数输入框里触发调用' },
    { keys: ['cURL'], desc: '复制当前 endpoint 的 cURL (含脱敏 token)' },
  ]},
  { title: '验收后端', items: [
    { keys: ['Overview'], desc: '4 个 KPI 卡 + 趋势图 + 最近活动,一眼看出后端跑得好不好' },
    { keys: ['Health'], desc: '9 维度健康检查 + Supabase + R2 + AI Budget 详细' },
    { keys: ['Logs'], desc: '按 date/hour 查 R2 持久化日志,排查 cron 异常' },
  ]},
];
function openHelp() {
  document.getElementById('help-body').innerHTML = `
    <div style="color: var(--text-2); font-size: 12.5px; margin-bottom: 14px;">
      Console <code style="font-family: var(--font-mono); background: var(--bg-2); padding: 1px 5px; border-radius: 3px;">100% 本地</code> · 跟 <code style="font-family: var(--font-mono); background: var(--bg-2); padding: 1px 5px; border-radius: 3px;">news-reader</code> 共用 Kinpaku tokens · Token 不离开浏览器
    </div>
    ${HELP_GROUPS.map(g => `
      <div class="health-section-title" style="margin: 14px 0 6px; padding-left: 0;">${g.title}</div>
      <div>
        ${g.items.map(it => `
          <div style="display:flex; align-items:center; gap:14px; padding:8px 0;">
            <div style="display:flex; gap:4px; min-width:120px;">${it.keys.map(k => `<span class="kbd">${k}</span>`).join('<span style="color:var(--text-3); font-size:11px;">+</span>')}</div>
            <div style="font-size:12.5px; color:var(--text-2); flex:1;">${it.desc}</div>
          </div>
        `).join('')}
      </div>
    `).join('')}
  `;
  document.getElementById('help-modal').style.display = 'flex';
}
function closeHelp() { document.getElementById('help-modal').style.display = 'none'; }

// ============================================================
// Bindings
// ============================================================
document.querySelectorAll('.tab').forEach(el => {
  el.addEventListener('click', () => {
    STATE.tab = el.dataset.tab;
    renderTab();
  });
});
document.getElementById('settings-btn').addEventListener('click', openSettings);
document.getElementById('settings-close').addEventListener('click', closeSettings);
document.getElementById('settings-cancel').addEventListener('click', closeSettings);
document.getElementById('settings-save').addEventListener('click', saveSettings);
document.getElementById('help-btn').addEventListener('click', openHelp);
document.getElementById('help-close').addEventListener('click', closeHelp);
document.getElementById('refresh-btn').addEventListener('click', refresh);

['settings-modal', 'help-modal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target.id === id) document.getElementById(id).style.display = 'none';
  });
});

document.addEventListener('keydown', e => {
  // ⌘K / ⌘? — Help
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === '?')) {
    e.preventDefault();
    const hm = document.getElementById('help-modal');
    hm.style.display === 'flex' ? closeHelp() : openHelp();
    return;
  }
  // ⌘R — Refresh
  if ((e.metaKey || e.ctrlKey) && e.key === 'r') {
    e.preventDefault();
    refresh();
    return;
  }
  // ⌘, — Settings
  if ((e.metaKey || e.ctrlKey) && e.key === ',') {
    e.preventDefault();
    openSettings();
    return;
  }
  // 1-4 — Switch tab (when not in input)
  if (!(e.metaKey || e.ctrlKey || e.altKey) && !['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) {
    if (e.key === '1') { STATE.tab = 'overview'; renderTab(); }
    else if (e.key === '2') { STATE.tab = 'data'; renderTab(); }
    else if (e.key === '3') { STATE.tab = 'logs'; renderTab(); }
    else if (e.key === '4') { STATE.tab = 'health'; renderTab(); }
  }
  // Esc — Close modals
  if (e.key === 'Escape') {
    const hm = document.getElementById('help-modal');
    const sm = document.getElementById('settings-modal');
    if (hm.style.display === 'flex') { closeHelp(); return; }
    if (sm.style.display === 'flex') { closeSettings(); return; }
  }
});

// ============================================================
// Boot
// ============================================================
updateStatus();
if (isConfigured()) {
  refresh();
} else {
  setTimeout(openSettings, 400);
}
</script>
