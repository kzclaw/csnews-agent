      3. **触发 event clustering**（验证 event_freshness 从 down 恢复）：
         ```bash
         curl -s -X POST "https://csnews.kwokzit.info/?action=event" \
           -H "Authorization: Bearer $CSNEWS_BEARER_TOKEN" \
           -H "Content-Type: application/json" \
           -d '{"type":"process"}'
         ```

      4. **检查 health 端点**（验证 cron_health 状态）：
         ```bash
         curl -s -H "Authorization: Bearer $CSNEWS_BEARER_TOKEN" \
           "https://csnews.kwokzit.info/?action=health" | \
           python3 -m json.tool | grep -E "status|cron_health|entity_freshness|event_freshness|last_process"
