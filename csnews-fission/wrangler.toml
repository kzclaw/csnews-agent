name = "csnews-fission"
main = "src/index.ts"
compatibility_date = "2026-05-29"

# Fission Worker：裂变触发器
# 职责：每 6 小时扫描 explosive+score=9 的 topic，执行裂变流程
# 架构：monorepo 子目录，与主 Worker 独立部署

# Workers AI（用于 LLM 生成搜索词 + 报告生成）
[ai]
binding = "AI"

# R2 bucket：裂变报告存储
# 复用主 Worker 的 csnews-raw bucket（同一账户级别资源）
[[r2_buckets]]
binding = "csnews_raw"
bucket_name = "csnews-raw"

# KV namespace：AI Neurons 用量追踪
# 复用主 Worker 的 AI_USAGE_KV namespace（同一账户级别资源）
[[kv_namespaces]]
binding = "AI_USAGE_KV"
id = "470a9354d39241a09e311cdac06a1c69"

# Cron Trigger：每 6 小时触发一次
# CF Free Plan 限制：每账号 5 个 cron triggers
# 主 Worker 4 槽位 (process / entity+event 合并 / archive / feedback) + Fission 1 槽位 = 5/5
# 方案 C: explosive+score=9 topics 稀少，6h 一次足够
[triggers]
crons = [ "0 */6 * * *" ]

# updated: sync cron to CF via auto-deploy on main push

# v0.37.13: 加 observability 暴露 console.error (跟 csnews-agent 5c991a5 一致)
# 之前 14 天 R2 写入 broken · 同样缺 [observability] 块让 console.error 看不到
[observability]
enabled = true
