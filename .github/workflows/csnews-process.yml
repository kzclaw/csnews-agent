name: CSNEWS Process

# 触发规则:
#   - schedule: 每小时一次(替代 macOS cron 的 2h 频率)
#   - workflow_dispatch: UI/CLI 手动触发(本地调试 + 紧急运行)
# 频率选择 1h 原因:
#   - GitHub Actions schedule 实际有 5-15 分钟漂移
#   - 比 2h 频率更密,确保热点新闻能更快入库
#   - 仍远低于 GitHub Actions 免费配额(2000 分钟/月)
# 注意: 此文件必须在仓库根的 .github/workflows/ 下才被识别
#       (不能放 csnews-agent/.github/ 这种子目录里)

on:
  schedule:
    - cron: '0 * * * *'  # 每小时整点
  workflow_dispatch:
    inputs:
      limit:
        description: '可选 limit (留空=Worker 默认)'
        required: false
        default: ''

jobs:
  process:
    name: Trigger Worker process action
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Trigger CSNEWS process
        env:
          BEARER_TOKEN: ${{ secrets.CSNEWS_BEARER_TOKEN }}
          MANUAL_LIMIT: ${{ inputs.limit }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -e
          URL="https://REDACTED-INTERNAL-DOMAIN/?action=process"
          if [[ -n "$MANUAL_LIMIT" ]]; then
            URL="${URL}&limit=${MANUAL_LIMIT}"
          fi
          echo "::group::Request"
          echo "trigger   : $TRIGGER"
          echo "url       : $URL"
          echo "time      : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "::endgroup::"

          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            --max-time 90 \
            -H "Authorization: Bearer $BEARER_TOKEN" \
            -H "User-Agent: csnews-process-workflow" \
            "$URL" || echo "000")

          echo "::group::Response"
          echo "http_code : $HTTP_CODE"
          if [[ -s /tmp/response.json ]]; then
            echo "body      : (first 800 chars)"
            head -c 800 /tmp/response.json
            echo
            SIZE=$(wc -c < /tmp/response.json)
            echo "body_size : $SIZE bytes"
          else
            echo "body      : (empty)"
          fi
          echo "::endgroup::"

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::Worker returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✓ process completed"

      - name: Log summary
        if: always()
        run: |
          echo "run_id    : ${{ github.run_id }}"
          echo "run_attempt: ${{ github.run_attempt }}"
          echo "conclusion: ${{ job.status }}"
