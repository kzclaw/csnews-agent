name = "csnews-agent"
main = "src/index.ts"
compatibility_date = "2026-05-29"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "csnews_raw"

[[kv_namespaces]]
binding = "AI_USAGE_KV"
# KV namespace ID 是公开标识符，非密钥
id = "470a9354d39241a09e311cdac06a1c69"

[vars]
AI_BUDGET_DAILY_LIMIT = "10000"
AI_BUDGET_WARNING_THRESHOLD = "5000"
AI_BUDGET_CRITICAL_THRESHOLD = "7000"
AI_BUDGET_SHUTDOWN_THRESHOLD = "8000"

[triggers]
# 每日 0 点 UTC 重置 Neurons 计数器
crons = ["0 0 * * *"]
