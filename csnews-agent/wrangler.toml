name = "csnews-agent"
main = "src/index.ts"
compatibility_date = "2026-05-29"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "csnews_raw"

[[kv_namespaces]]
binding = "AI_USAGE_KV"
# KV namespace ID 是公开标识符，非密钥
id = "470a9354d39241a09e311cdac06a1c69"

[[kv_namespaces]]
binding = "PROCESS_STATE"
# KV namespace ID 是公开标识符，非密钥
id = "3be3cd1e5da544cd9b323f3b8a4af7a0"

[[kv_namespaces]]
binding = "PROCESS_STATE_PREVIEW"
preview_id = "c8b14c901b114f32aa5903a2d733ff91"

[vars]
AI_BUDGET_DAILY_LIMIT = "10000"
AI_BUDGET_WARNING_THRESHOLD = "5000"
AI_BUDGET_CRITICAL_THRESHOLD = "7000"
AI_BUDGET_SHUTDOWN_THRESHOLD = "8000"
# v0.37.17 (v0.37.17 board decision): 删 WORKER_VERSION 手写版本号 — 改成从 PROCESS_STATE KV 读 `worker_git_sha`
# 每次 commit + push 之后跑 csnews-write-version.sh 写 KV,健康端点立即显示新 commit 编号
# 之前 v0.36.10.6 hard rule 删 WORKER_VERSION · v0.37.6 加回手写 · v0.37.17 改用自动 commit 编号

[triggers]
# 4/5 cron 槽位（CF 账户上限 5 · csnews-fission 用 1 + csnews-agent 用 4）
# 董事长 2026-07-02 00:17 push back: "CSNEWS-fission 1 cron + CSNEWS-agent 4 cron = 5 满了"
# 14 天来 0 1 1 * * archive cron 部署永远失败 (schedules API 5/5 满)
# 删 archive · 4/5 留 1 空位给 csnews-fission 扩展或未来新功能
# 0 * * * *          → scheduledProcess: ZAKER + Tavily + knowledge（每小时 00 分 UTC）
# 0 3,15 * * *      → scheduledEntity: entity selflearn + event clustering（每日 03:00 & 15:00 UTC）
# 0 4 * * *         → scheduledFeedback: feedback loop（每日 04:00 UTC）
# 0 0 * * *         → scheduledReset: AI_USAGE_KV `usage/{YYYY-MM-DD}` 计数器每日 UTC 0 点清零
crons = [
  "0 * * * *",
  "0 3,15 * * *",
  "0 4 * * *",
  "0 0 * * *",
]

# v0.37.13 (a5a31b0 deployment failed): 加 observability 暴露 console.error
# 之前 14 天 R2 写入 broken · saveToR2 console.error 看不到是因为 wrangler.toml 缺 [observability] 块
# 修复: 董事长 push back 指出 "wrangler.toml 根本没有开 log"
[observability]
enabled = true
