name = "csnews-agent"
main = "src/index.ts"
compatibility_date = "2026-05-29"

# Observability: 开启 CF Workers Tail Logs / Logs 实时面板
# kzclaw 2026-06-10 确定: 开 log 看 cron scheduled handler 内部 fetch 失败原因
# (过去 24h news=0 但 CF Dashboard cron 记成功 → scheduled handler 内部 fetch 失败被 try/catch 吞)
# head_sampling_rate = 1.0 全采样 (Worker Free Plan 默认支持, 5 重安全网之一)
# 注: wrangler 4.95 不认顶层 log_level 字段, 控制台级别用 [observability] + [logging] 子块
[observability]
enabled = true
head_sampling_rate = 1.0

[ai]
binding = "AI"

[[r2_buckets]]
binding = "csnews_raw"

[vars]
# Worker 自身的公开 URL —— 用于 Cron Trigger 自调 process action
# 部署时必须替换为你的真实 Worker URL (例: https://example.workers.dev)
# 留占位符则 Worker 部署后 scheduled handler 会失败(URL 无效)
WORKER_SELF_URL = "https://YOUR-WORKER.workers.dev"

# Worker 版本标识 —— ?action=health 端点返回 worker_version 字段
# kzclaw部署新版本后手动改这里(或接 GitHub Actions 自动化)
# 默认值: v0.34.0-dev (本次 5 步实施基线, 部署后由kzclaw决定升级)
WORKER_VERSION = "v0.34.0-dev"

# 每小时整点(UTC)跑一次 process action
# 替代 macOS cron 的 2h 频率 + 之前误用的 GitHub Actions
# 选 CF cron 的原因:
#   1. Free tier 实际可用(每账号 5 个,CPU 10ms 限制)
#   2. Worker → 自家域名走 CF 内部 routing,绕开 Bot Fight Mode
#   3. 0 漂移(精准整点),0 外部依赖
#   4. process 主要是 fetch 等待,不算 CPU,10ms 限制够用
# log 30d TTL 靠 R2 lifecycle rule 兜底 (CF Dashboard 配 prefix=logs/ MaxAge=30d)
[triggers]
crons = [ "0 * * * *" ]
